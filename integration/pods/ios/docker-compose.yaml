# IOS demo integration pod for ophyd-service.
#
# Phases 1 + 2 of the IOS use case: simulated PGM monochromator + current-amp
# + EPU IOCs behind the config-service + direct-control stack, with the IOS
# site happi DB loaded. Lets the periodic-table flow exercise a real
# round-trip:
#   frontend (or exercise script) → POST /api/v1/pv/set/batch on direct-control
#   → caput to XF:23ID2-OP{Mono}* / XF:23ID2-ES{CurrAmp:N}* / XF:23ID-ID{EPU:N}*
#   → simulated readback (PGM has slew dynamics, CurrAmp/EPU are echo-only)
#
# Services:
#   ios_iocs               — the simulated IOS beamline in one container, built
#                            from integration/queueserver-repro/iocs (the single
#                            source of the IOC scripts): PGM, current amps, EPU,
#                            Vortex, scaler, M1B1 feedback and Xspress3 on CA
#                            ports 5064..5076 (step 2) plus the blackhole
#                            catch-all on 5078 — the same layout reproduce.sh
#                            runs on a host, so XAS_scan stages here too.
#   configuration_service  — registry, loaded from integration/happi/sites/ios/happi_db.json
#   direct_control_service — WS/REST PV commanding
#
# Relative paths assume this file lives at integration/pods/ios/, so
# `../..` reaches integration/ and `../../..` reaches the ophyd-service root.
#
# Usage:
#   docker compose up --build
#   docker compose down
#   docker compose logs -f direct_control_service

services:
  ios_iocs:
    build:
      context: ../../queueserver-repro/iocs
    environment:
      IOC_BASE_PORT: "5064"
    healthcheck:
      # run_all_iocs.sh touches this once every IOC and the blackhole listen.
      test: ["CMD-SHELL", "test -f /tmp/ios_iocs/ready"]
      interval: 5s
      timeout: 2s
      retries: 24

  configuration_service:
    build:
      context: ../../../backend/configuration_service
    environment:
      CONFIG_LOAD_STRATEGY: "happi"
      CONFIG_PROFILE_PATH: "/profile"
      # config-service migrated from a bare SQLite path to a SQLAlchemy DSN
      # (CONFIG_DATABASE_URL); the old CONFIG_DB_PATH is ignored and startup
      # then fails because device_change_history_enabled defaults to True.
      CONFIG_DATABASE_URL: "sqlite+pysqlite:////tmp/config_service.db"
      # The resolver walks ophyd device classes statically (no IOC connection);
      # for IOS classes (ios_devs.PGM etc.) ios_devs.py must be importable.
      # /profile is the mounted IOS site dir, which contains ios_devs.py.
      PYTHONPATH: "/profile"
    volumes:
      # Mount the IOS site dir specifically — the loader looks for
      # happi_db.json at the top of CONFIG_PROFILE_PATH (non-recursive),
      # so pointing at integration/happi/ would pick up the generic seed
      # instead of the IOS one.
      - ../../happi/sites/ios:/profile:ro
    ports:
      - "8004:8004"

  direct_control_service:
    build:
      context: ../../../backend/direct_control_service
    environment:
      DIRECT_CONTROL_CONFIGURATION_SERVICE_URL: http://configuration_service:8004
      # No EE service in the pod; coordination check would 502 every call.
      DIRECT_CONTROL_COORDINATION_CHECK_ENABLED: "false"
      # Enable control writes (caput). Default is true = monitor-only, which
      # makes every /pv/set return 403. Set false so the frontend Apply button
      # can write scan + detector values to the live PVs.
      DIRECT_CONTROL_GLOBAL_READ_ONLY: "false"
      # pyepics: point CA search at every CA server port inside the ios_iocs
      # container (seven IOCs + blackhole, IOC_BASE_PORT step 2). AUTO_ADDR_LIST
      # off means no broadcast — explicit list keeps search packets on the
      # compose network.
      EPICS_CA_ADDR_LIST: "ios_iocs:5064 ios_iocs:5066 ios_iocs:5068 ios_iocs:5070 ios_iocs:5072 ios_iocs:5074 ios_iocs:5076 ios_iocs:5078"
      EPICS_CA_AUTO_ADDR_LIST: "NO"
    ports:
      - "8003:8003"
    depends_on:
      configuration_service:
        condition: service_healthy
      ios_iocs:
        condition: service_healthy

  presets_service:
    build:
      context: ../../../backend/presets_service
    environment:
      PRESETS_DB_PATH: "/data/presets.db"
      PRESETS_SEED_PATH: "/seed"
    volumes:
      - ../../presets:/seed:ro
      - presets_data:/data
    ports:
      - "8005:8005"

  frontend:
    build:
      context: ../../../frontend
      target: dev
    environment:
      # Inside the container, localhost is the container itself — point the Vite
      # dev-server proxy at sibling services by their compose service names.
      VITE_PRESETS_TARGET: http://presets_service:8005
      VITE_CONFIG_TARGET: http://configuration_service:8004
      VITE_CONTROL_TARGET: http://direct_control_service:8003
    ports:
      - "5173:5173"
    depends_on:
      - configuration_service
      - direct_control_service
      - presets_service

volumes:
  presets_data:
