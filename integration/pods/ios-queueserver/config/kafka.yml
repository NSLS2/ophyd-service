# The IOS profile calls nslsii.configure_base(..., publish_documents_with_kafka=True),
# which reads this file. The pod runs a single-node KRaft broker (service
# `kafka`) so document publishing — and therefore RUNNING plans — completes.
# abort_run_on_kafka_exception stays false so a flaky broker never fails a run.
abort_run_on_kafka_exception: false
bootstrap_servers:
  - kafka:9092
runengine_producer_config:
  security.protocol: PLAINTEXT
